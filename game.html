<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Soccer Snake 🐍⚽</title>

  <style>
    body {
        font-family: Arial, sans-serif;
        background: #0b6623;
        display: flex;
        flex-direction: column;
        align-items: center;
        color: white;
        margin: 0;
        padding: 20px;
    }
    .home-link {
        text-decoration: none;
        color: white;
        border: 2px solid white;
        padding: 8px 16px;
        border-radius: 20px;
        font-weight: bold;
        margin-bottom: 10px;
        transition: all 0.2s ease;
    }

    .home-link:hover {
        background: white;
        color: #0b6623;
    }
    h1 {
        margin-bottom: 10px;
    }

    #score {
        margin-bottom: 10px;
        font-size: 18px;
    }

    .game-board {
        width: 400px;
        height: 400px;
        display: grid;
        grid-template-columns: repeat(20, 1fr);
        grid-template-rows: repeat(20, 1fr);
        border: 4px solid white;
        position: relative;

        background:
        repeating-linear-gradient(
          90deg,
          #1e7f3f,
          #1e7f3f 40px,
          #166534 40px,
          #166534 80px
        );
    }

    .game-board::before {
        content: "";
        position: absolute;
        top: 0;
        left: 50%;
        width: 2px;
        height: 100%;
        background: white;
        transform: translateX(-50%);
        opacity: 0.7;
    }

    .game-board::after {
        content: "";
        position: absolute;
        width: 80px;
        height: 80px;
        border: 2px solid white;
        border-radius: 50%;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        opacity: 0.7;
    }

    /* Goal boxes */
    .goal {
        position: absolute;
        width: 40px;
        height: 120px;
        border: 2px solid white;
        top: 50%;
        transform: translateY(-50%);
        opacity: 0.7;
        z-index: 1;
    }

    .goal.left {
        left: 0;
    }

    .goal.right {
        right: 0;
    }

    .snake {
        background-color: #ffffff;
        border-radius: 4px;
        z-index: 2;
    }

    .food {
        background-color: black;
        border-radius: 50%;
        position: relative;
        z-index: 2;
    }

    .food::after {
        content: "⚽";
        position: absolute;
        top: -6px;
        left: -6px;
        font-size: 20px;
    }

    button {
        margin-top: 15px;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        border: none;
        border-radius: 6px;
        background: white;
        color: #0b6623;
        font-weight: bold;
    }

    button:hover {
        background: #e5e5e5;
    }

    .instructions {
        margin-top: 10px;
        font-size: 14px;
        opacity: 0.9;
    }
  </style>
</head>

<body>
  <h1>Soccer Snake ⚽🐍</h1>
  <a href="from.scratch.html" class="home-link">← Back to Home</a>
  <div id="score">Score: 0</div>

  <div class="game-board" id="gameBoard">
    <div class="goal left"></div>
    <div class="goal right"></div>
  </div>

  <button onclick="startGame()">Start / Restart</button>

  <div class="instructions">
    Use arrow keys ⬅️⬆️⬇️➡️ to move
  </div>

  <script>
    const board = document.getElementById("gameBoard");
    const scoreDisplay = document.getElementById("score");

    const boardSize = 20;
    let snake = [{ x: 10, y: 10 }];
    let food = {};
    let direction = { x: 0, y: 0 };
    let score = 0;
    let gameInterval;

    function startGame() {
      snake = [{ x: 10, y: 10 }];
      direction = { x: 0, y: 0 };
      score = 0;
      scoreDisplay.textContent = "Score: 0";
      placeFood();

      clearInterval(gameInterval);
      gameInterval = setInterval(gameLoop, 150);
    }

    function gameLoop() {
      moveSnake();
      if (checkCollision()) {
        alert("Game Over! Final Score: " + score);
        clearInterval(gameInterval);
        return;
      }
      drawBoard();
    }

    function moveSnake() {
      const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y,
      };

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreDisplay.textContent = "Score: " + score;
        placeFood();
      } else {
        snake.pop();
      }
    }

    function checkCollision() {
      const head = snake[0];

      // Wall collision
      if (
        head.x < 0 ||
        head.x >= boardSize ||
        head.y < 0 ||
        head.y >= boardSize
      ) {
        return true;
      }

      // Self collision
      for (let i = 1; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
          return true;
        }
      }

      return false;
    }

    function placeFood() {
      food = {
        x: Math.floor(Math.random() * boardSize),
        y: Math.floor(Math.random() * boardSize),
      };
    }

    function drawBoard() {
      // Clear only snake & food, keep goals
      const goals = document.querySelectorAll(".goal");
      board.innerHTML = "";
      goals.forEach(goal => board.appendChild(goal));

      snake.forEach(segment => {
        const snakeElement = document.createElement("div");
        snakeElement.classList.add("snake");
        snakeElement.style.gridColumnStart = segment.x + 1;
        snakeElement.style.gridRowStart = segment.y + 1;
        board.appendChild(snakeElement);
      });

      const foodElement = document.createElement("div");
      foodElement.classList.add("food");
      foodElement.style.gridColumnStart = food.x + 1;
      foodElement.style.gridRowStart = food.y + 1;
      board.appendChild(foodElement);
    }

    document.addEventListener("keydown", e => {
      switch (e.key) {
        case "ArrowUp":
          if (direction.y === 0) direction = { x: 0, y: -1 };
          break;
        case "ArrowDown":
          if (direction.y === 0) direction = { x: 0, y: 1 };
          break;
        case "ArrowLeft":
          if (direction.x === 0) direction = { x: -1, y: 0 };
          break;
        case "ArrowRight":
          if (direction.x === 0) direction = { x: 1, y: 0 };
          break;
      }
    });
  </script>
</body>
</html>
